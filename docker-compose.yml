services:
  zipsa:
    build: .
    container_name: zipsa
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOCAL_HOST=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
